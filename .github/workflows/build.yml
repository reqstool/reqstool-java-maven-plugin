on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      artifact-name:
        description: >
          Name to upload the build output under. The release flow runs this
          workflow twice in one run -- once on the branch, once on the tag -- and
          upload-artifact rejects a duplicate name.
        required: false
        type: string
        default: "dist"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  linting:
    name: Check linting
    uses: ./.github/workflows/lint.yml
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        reqstool-source: [pypi, main]
    steps:
      # Full history and tags: Nisse derives the version from git state, so a
      # shallow clone would build the wrong number rather than fail.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up JDK
        uses: actions/setup-java@v5.7.0
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Build and run tests
        run: mvn clean verify
      - name: Install plugin into local repository
        run: mvn -DskipTests install
      - name: Self-apply plugin to assemble dataset zip
        run: |
          VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          mvn io.github.reqstool:reqstool-maven-plugin:${VERSION}:assemble-and-attach-zip-artifact \
            -Dreqstool.datasetPath=docs/reqstool \
            -Dreqstool.outputDirectory=target/reqstool
      - name: Install reqstool
        uses: reqstool/.github/.github/actions/install-reqstool@ef815eae0bca7160cdc714126cac73f76d638b39 # 1.0.0
        with:
          reqstool-source: ${{ matrix.reqstool-source }}
      - name: Validate reqstool spec completeness
        # not yet available in the latest PyPI release
        if: matrix.reqstool-source == 'main'
        uses: reqstool/.github/.github/actions/validate-reqstool@ef815eae0bca7160cdc714126cac73f76d638b39 # 1.0.0
      - name: Run reqstool status
        uses: reqstool/.github/.github/actions/reqstool-status@ef815eae0bca7160cdc714126cac73f76d638b39 # 1.0.0
        with:
          fail-if-incomplete: "true"

  validate-openspec:
    uses: reqstool/.github/.github/workflows/common-validate-openspec.yml@ef815eae0bca7160cdc714126cac73f76d638b39 # 1.0.0
