on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      artifact-name:
        description: >
          Name to upload the build output under. The release flow runs this
          workflow twice in one run -- once on the branch, once on the tag -- and
          upload-artifact rejects a duplicate name.
        required: false
        type: string
        default: "dist"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  lint:
    uses: reqstool/.github/.github/workflows/java-lint.yml@91cd368066d5458b5d46bdf34c4d8ca483f6633f # 1.2.2

  build:
    needs: lint
    uses: reqstool/.github/.github/workflows/java-build-maven.yml@91cd368066d5458b5d46bdf34c4d8ca483f6633f # 1.2.2
    with:
      ref: ${{ inputs.ref }}
      artifact-name: ${{ inputs.artifact-name || 'dist' }}
      post-test-command: |
        mvn --batch-mode -DskipTests install
        VERSION=$(mvn --batch-mode -q help:evaluate -Dexpression=project.version -DforceStdout)
        mvn --batch-mode io.github.reqstool:reqstool-maven-plugin:${VERSION}:assemble-and-attach-zip-artifact \
          -Dreqstool.datasetPath=docs/reqstool \
          -Dreqstool.outputDirectory=target/reqstool

  reqstool:
    needs: build
    uses: reqstool/.github/.github/workflows/common-reqstool-verify.yml@91cd368066d5458b5d46bdf34c4d8ca483f6633f # 1.2.2
    with:
      build-artifact: ${{ inputs.artifact-name || 'dist' }}-build
      build-directory: target

  smoke:
    needs: build
    uses: reqstool/.github/.github/workflows/java-smoke.yml@91cd368066d5458b5d46bdf34c4d8ca483f6633f # 1.2.2
    with:
      command: mvn --batch-mode verify

  validate-openspec:
    uses: reqstool/.github/.github/workflows/common-validate-openspec.yml@91cd368066d5458b5d46bdf34c4d8ca483f6633f # 1.2.2

  ci:
    if: ${{ always() }}
    needs: [lint, build, reqstool, smoke, validate-openspec]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c 'import json,sys; r={k:v["result"] for k,v in json.load(sys.stdin).items()}; print(r); sys.exit(0 if all(v=="success" for v in r.values()) else 1)'
