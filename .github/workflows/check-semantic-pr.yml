name: Check Semantic PR
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  # The callee reads PR metadata to validate the title; contents is not enough,
  # and a callee may not request more than it is granted.
  pull-requests: read

jobs:
  check:
    uses: reqstool/.github/.github/workflows/common-check-semantic-pr.yml@ef815eae0bca7160cdc714126cac73f76d638b39 # 1.0.0
